name: Build, Test and Push Multi-Arch Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'kolokwium/**' # uruchomienie tylko gdy zmienia sie cos w folderze kolokwium

jobs:
  build-and-security-check:
    runs-on: ubuntu-latest

    steps:
      # pobranie kodu zrodlowego
      - name: Checkout repository
        uses: actions/checkout@v4

      # konfiguracja qemu dla arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # konfiguracja docker buildx do obslugi cache registry i multi-arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # logowanie do docker hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # logowanie do ghcr
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # budowanie obrazu lokalnie do skanowania cve
      - name: Build local image for CVE scanning
        uses: docker/build-push-action@v6
        with:
          context: ./kolokwium
          file: ./kolokwium/Dockerfile
          push: false
          load: true # laduje obraz do dockera
          tags: ghcr.io/${{ github.repository_owner }}/weather-app:test-cve
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/weather-app-cache:main

      # skanowanie obrazu przez trivy (warunek krytyczny/wysoki)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/weather-app:test-cve'
          format: 'table'
          exit-code: '1' # zatrzymaj pipeline jesli sa podatnosci
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # budowanie i wyslanie obrazu multi arch
      - name: Build and push Multi-Arch Image with Max Cache
        uses: docker/build-push-action@v6
        with:
          context: ./kolokwium
          file: ./kolokwium/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weather-app:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/weather-app:latest
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/weather-app-cache:main
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/weather-app-cache:main,mode=max