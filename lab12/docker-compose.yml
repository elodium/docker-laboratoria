name: lab12

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: lab12_nginx
    ports:
      - "4001:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - front
      - back

  php:
    image: php:8.2-fpm-alpine
    container_name: lab12_php
    volumes:
      - ./www:/var/www/html
    networks:
      - back

  mysql:
    image: mysql:8.0
    container_name: lab12_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - back

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: lab12_phpmyadmin
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql
    networks:
      - back

networks:
  front:
    driver: bridge
  back:
    driver: bridge

volumes:
  mysql_data:
    driver: local
