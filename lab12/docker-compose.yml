name: lab12

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: lab12_nginx
    volumes:
      - ./www:/var/www/html
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - front
      - back

  php:
    image: php:8.2-fpm-alpine
    container_name: lab12_php
    volumes:
      - ./www:/var/www/html
    networks:
      - back

  mysql:
    image: mysql:8.0
    container_name: lab12_mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - back

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: lab12_phpmyadmin
    depends_on:
      - mysql
    networks:
      - front
      - back

networks:
  front:
    driver: bridge
  back:
    driver: bridge

volumes:
  mysql_data:
    driver: local
